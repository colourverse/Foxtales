# Uploads the website to foxtales.me whenever main changes
# (for example when a pull request is merged).
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    the FTP server name, e.g. ftp.moonlet.co.uk
#   FTP_USERNAME  an FTP account whose directory is the foxtales.me folder
#   FTP_PASSWORD  that account's password
#
# Only files that changed since the last upload are sent. To re-run by hand:
# Actions → Deploy to foxtales.me → Run workflow.

name: Deploy to foxtales.me

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            supabase/**
            README.md
