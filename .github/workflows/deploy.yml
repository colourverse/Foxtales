# Uploads the website to foxtales.me whenever main changes
# (for example when a pull request is merged).
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    the FTP server name, e.g. ftp.moonlet.co.uk
#   FTP_USERNAME  an FTP account whose directory is the foxtales.me folder
#   FTP_PASSWORD  that account's password
#
# Only files that changed since the last upload are sent. To re-run by hand:
# Actions → Deploy to foxtales.me → Run workflow.

name: Deploy to foxtales.me

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # Give the style and code files a new address on every deploy (style.css?v=1a2b3c4),
      # so browsers (Safari especially) fetch the new versions instead of reusing old copies.
      - name: Stamp file versions
        run: |
          sed -i "s/?v=dev\"/?v=${GITHUB_SHA::7}\"/g" index.html
          grep -o '?v=[^"]*' index.html | sort -u
          if grep -q '?v=dev"' index.html; then echo "Version stamp failed"; exit 1; fi

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            supabase/**
            README.md
